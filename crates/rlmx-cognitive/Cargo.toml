[package]
name = "rlmx-cognitive"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
ndarray = "0.16"

# Optional: ruvector SONA
ruvector-sona = { version = "0.1.6", optional = true }

[features]
default = []
ruvector-sona = ["dep:ruvector-sona"]
