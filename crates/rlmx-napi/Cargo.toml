[package]
name = "rlmx-napi"
version = "0.1.0"
edition = "2021"
description = "NAPI-RS native binding layer for the RuVix cognition kernel (ADR-020)"

[dependencies]
rlmx-kernel = { path = "../rlmx-kernel" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

# Optional: napi-rs bindings (feature-gated)
napi = { version = "2", features = ["serde-json"], optional = true }
napi-derive = { version = "2", optional = true }

[features]
default = []
napi = ["dep:napi", "dep:napi-derive"]

[dev-dependencies]
tokio = { workspace = true }
