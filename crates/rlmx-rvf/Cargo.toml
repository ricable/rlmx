[package]
name = "rlmx-rvf"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
sha2 = { workspace = true }
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = { workspace = true }
hex = { workspace = true }

# Optional: RVF format crates from crates.io
rvf-types = { workspace = true, optional = true }
rvf-runtime = { workspace = true, optional = true }
rvf-wire = { workspace = true, optional = true }
rvf-index = { workspace = true, optional = true }
rvf-quant = { workspace = true, optional = true }
rvf-crypto = { workspace = true, optional = true }

[features]
default = []
rvf-ext = [
    "dep:rvf-types",
    "dep:rvf-runtime",
    "dep:rvf-wire",
    "dep:rvf-index",
    "dep:rvf-quant",
    "dep:rvf-crypto",
]
