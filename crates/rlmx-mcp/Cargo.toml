[package]
name = "rlmx-mcp"
version = "0.1.0"
edition = "2021"
description = "MCP (Model Context Protocol) server for the RuVix kernel"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
thiserror = "2"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
rlmx-kernel = { path = "../rlmx-kernel" }
rlmx-rvf = { path = "../rlmx-rvf" }
rlmx-ruvllm = { path = "../rlmx-ruvllm", default-features = false }
