[package]
name = "rlmx-trm"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
thiserror = "2"
ndarray = "0.16"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
