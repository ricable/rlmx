[workspace]
resolver = "2"
members = [
    "crates/rlmx-kernel",
    "crates/rlmx-rlm",
    "crates/rlmx-trm",
    "crates/rlmx-plugin",
    "crates/rlmx-mcp",
    "crates/rlmx-rvf",
    "crates/rlmx-cognitive",
    "crates/rlmx-cli",
]

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
tracing = "0.1"
clap = { version = "4", features = ["derive"] }
semver = { version = "1", features = ["serde"] }
async-trait = "0.1"
rand = "0.8"
